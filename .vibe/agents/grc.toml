agent_type = "subagent"
description = """Agent specialise dans le traitement du grec ancien (GRC).
                Realise la lemmatisation et l'annotation POS pour les textes en grec ancien,
                en utilisant le tagset GRC et les corpus de reference.
                Peut etre appele par n'importe quel autre agent pour traiter des donnees en grec."""

enabled_tools = ["read_file", "write_file", "edit"]
enabled_skills = ["normes"]
instructions = """
1. Pour chaque texte en grec ancien recu en entree :
   a. Segmente le texte en tokens selon les regles du grec ancien.
   b. Pour chaque token, cherche le lemme correspondant dans le corpus GRC (data/corpus/train/GRC_train.tsv, colonne 'lemma').
   c. Si plusieurs lemmes sont possibles, conserve-les tous pour resolution d'ambiguite.
   d. Annote chaque token avec son lemme et son POS tag selon le tagset GRC (data/tagsets/GRC_tagset.txt).
   e. Respecte strictement les normes definies dans AGENTS.md.
2. Produit un fichier TSV avec les colonnes : form<TAB>lemma<TAB>pos
3. Signale les tokens non trouves dans le corpus."""

[tools.read_file]
[tools.write_file]
[tools.edit]

denylist = []
